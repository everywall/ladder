schemaVersion: 1
id: wikipedia
version: "1.0.0"
rules:
  - id: english-articles
    domains: [en.wikipedia.org]
    paths: [/wiki]
    headers:
      set:
        User-Agent: "Ladder/1.0 (https://github.com/everywall/ladder)"
      remove: [X-Forwarded-For, Referer]
    remove: ["#mw-panel", "#footer", ".mw-editsection"]
    tests:
      - name: encyclopedia-article
        url: https://en.wikipedia.org/wiki/Encyclopedia
        status: 200
        contains: [Encyclopedia]
        notContains: ['id="mw-panel"']
      - name: http-article
        url: https://en.wikipedia.org/wiki/HTTP
        status: 200
        contains: [HTTP]
        notContains: ['id="mw-panel"']
      - name: proxy-server-article
        url: https://en.wikipedia.org/wiki/Proxy_server
        status: 200
        contains: [proxy server]
        notContains: ['id="mw-panel"']
